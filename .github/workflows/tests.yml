name: Tests & Allure Report

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: write

# -----------------------------------------------------------------------------
# YAML Anchors or reuse env variables
# -----------------------------------------------------------------------------
x-env: &common-env
  ENV: staging
  AUTH_KEY: ${{ secrets.AUTH_KEY }}
  RESTFULL_USER: ${{ secrets.RESTFULL_USER }}
  RESTFULL_PASSWORD: ${{ secrets.RESTFULL_PASSWORD }}

jobs:
  # ===========================================================================
  # 1. API TESTS (Parallel)
  # ===========================================================================
  test-api:
    name: Run API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env: *common-env

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create reports directory
        run: |
          mkdir -p reports
          mkdir -p allure-results-api

      - name: Run API tests
        run: pytest -m "api" --junitxml=reports/pytest-report-api.xml --html=reports/report-api.html --self-contained-html --alluredir=allure-results-api
        continue-on-error: true

      - name: Publish Pytest Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: API Pytest Results
          path: reports/pytest-report-api.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload allure-results (API)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: allure-results-api/
          retention-days: 3

      - name: Upload XML Report Artifact (API)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xml-report-api
          path: reports/pytest-report-api.xml
          retention-days: 1

      - name: Upload HTML Report Artifact (API)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-html-report-api
          path: reports/report-api.html
          retention-days: 14

  # ===========================================================================
  # 2. UI TESTS (Parallel)
  # ===========================================================================
  test-ui:
    name: Run UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env: *common-env

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps

      - name: Install Playwright system dependencies (if cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps

      - name: Create reports directory
        run: |
          mkdir -p reports
          mkdir -p allure-results-ui

      - name: Run UI tests
        run: pytest -m "ui" --junitxml=reports/pytest-report-ui.xml --html=reports/report-ui.html --self-contained-html --alluredir=allure-results-ui
        continue-on-error: true

      - name: Publish Pytest Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: UI Pytest Results
          path: reports/pytest-report-ui.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload allure-results (UI)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui
          path: allure-results-ui/
          retention-days: 3

      - name: Upload XML Report Artifact (UI)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xml-report-ui
          path: reports/pytest-report-ui.xml
          retention-days: 1

      - name: Upload HTML Report Artifact (UI)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-html-report-ui
          path: reports/report-ui.html
          retention-days: 14

  # ===========================================================================
  # 3. SUMMARY, ALLURE MERGE & CLEANUP
  # ===========================================================================
  publish-allure:
    name: Publish Allure Report & Combined Summary
    runs-on: ubuntu-latest
    needs: [ test-api, test-ui ]
    if: always() && !cancelled()
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Скачуємо API та UI артефакти у власні директорії
      - name: Download API allure-results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-api
          path: allure-results-api/

      - name: Download UI allure-results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-ui
          path: allure-results-ui/

      - name: Merge Allure Results
        run: |
          mkdir -p allure-results
          if [ -d allure-results-api ]; then cp -r allure-results-api/* allure-results/ 2>/dev/null || true; fi
          if [ -d allure-results-ui ]; then cp -r allure-results-ui/* allure-results/ 2>/dev/null || true; fi

      - name: Download XML reports for combined summary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: xml-report-*
          path: reports/
          merge-multiple: true

      # === TEST SUMMARY (API + UI + TOTAL) ===
      - name: Generate Combined Test Summary
        if: always()
        run: |
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET
          import os

          def parse_xml(file_path):
              if not os.path.exists(file_path):
                  return None
              try:
                  tree = ET.parse(file_path)
                  ts = tree.getroot().find("testsuite") or tree.getroot()
                  attrs = ts.attrib
                  total = int(attrs.get("tests", 0))
                  errors = int(attrs.get("errors", 0))
                  fails = int(attrs.get("failures", 0))
                  skip = int(attrs.get("skipped", 0))
                  passed = total - fails - errors - skip
                  return {
                      "total": total,
                      "passed": passed,
                      "failed": fails,
                      "errors": errors,
                      "skipped": skip
                  }
              except Exception:
                  return None

          api_res = parse_xml("reports/pytest-report-api.xml")
          ui_res = parse_xml("reports/pytest-report-ui.xml")

          def format_row(name, res):
              if res is None:
                  return f"| **{name}** | *FAILED TO RUN / NO XML* | - | - | - | - |"
              return f"| **{name}** | {res['total']} | {res['passed']} | {res['failed']} | {res['errors']} | {res['skipped']} |"

          tot_tests = (api_res['total'] if api_res else 0) + (ui_res['total'] if ui_res else 0)
          tot_pass  = (api_res['passed'] if api_res else 0) + (ui_res['passed'] if ui_res else 0)
          tot_fail  = (api_res['failed'] if api_res else 0) + (ui_res['failed'] if ui_res else 0)
          tot_err   = (api_res['errors'] if api_res else 0) + (ui_res['errors'] if ui_res else 0)
          tot_skip  = (api_res['skipped'] if api_res else 0) + (ui_res['skipped'] if ui_res else 0)

          print("## Combined Test Results\n")
          print("| Suite | Total | Passed | Failed | Errors | Skipped |")
          print("| :--- | :---: | :---: | :---: | :---: | :---: |")
          print(format_row("API Tests", api_res))
          print(format_row("UI Tests", ui_res))

          if api_res or ui_res:
              print(f"| **TOTAL** | **{tot_tests}** | **{tot_pass}** | **{tot_fail}** | **{tot_err}** | **{tot_skip}** |")
          else:
              print("| **TOTAL** | *NO SUITES EXECUTED* | - | - | - | - |")
          EOF

      - name: Cache Allure CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: allure-cli-${{ runner.os }}

      - name: Install Allure CLI
        run: |
          npm config set prefix ~/.npm-global
          npm install -g allure
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          sparse-checkout: history.jsonl
          sparse-checkout-cone-mode: false

      - name: Restore history file
        run: |
          mkdir -p allure-report
          if [ -f gh-pages/history.jsonl ]; then
            cp gh-pages/history.jsonl allure-report/history.jsonl
          fi
        continue-on-error: true

      - name: Generate Allure Report
        run: allure generate allure-results --output allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true

      - name: Purge Old Artifacts
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const targetArtifacts = [
              'pytest-html-report-api',
              'pytest-html-report-ui',
              'xml-report-api',
              'xml-report-ui',
              'allure-results-api',
              'allure-results-ui'
            ];
            const keepRecent = 5;

            for (const artifactName of targetArtifacts) {
              try {
                const artifacts = await github.rest.actions.listArtifactsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: artifactName,
                  per_page: 100,
                });
                const sorted = artifacts.data.artifacts.sort(
                  (a, b) => new Date(b.created_at) - new Date(a.created_at)
                );
                const toDelete = sorted.slice(keepRecent);
                for (const artifact of toDelete) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  console.log(`Deleted artifact: ${artifact.name} (id: ${artifact.id})`);
                }
              } catch (err) {
                console.log(`Could not process artifacts for ${artifactName}: ${err.message}`);
              }
            }